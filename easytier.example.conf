# TOML configuration. Copy to private easytier.conf before filling credentials.
# Select an unused virtual IP in your own mesh subnet.
ipv4 = "10.126.126.2"
listeners = [
    "tcp://0.0.0.0:11010",
    "udp://0.0.0.0:11010",
    "ws://0.0.0.0:11011/",
    "wss://0.0.0.0:11012/",
]

[network_identity]
network_name = "YOUR_NETWORK_NAME"
network_secret = "YOUR_NETWORK_SECRET"

[[peer]]
uri = "wss://relay.example.com:8443/ws"

# Optional: export your actual LAN subnet to the mesh.
# [[proxy_network]]
# cidr = "192.168.1.0/24"

[flags]
# Allow HEV's system routes to carry the WSS connection.
bind_device = false
# HEV owns tun0; EasyTier must use another interface.
dev_name = "et0"
# Use userspace TCP subnet forwarding with OpenWrt firewall rules.
use_smoltcp = true
